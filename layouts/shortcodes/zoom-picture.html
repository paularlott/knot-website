{{- $src := .Get "src" -}}
{{- $caption := .Get "caption" | default "" -}}
{{- $alt := .Get "alt" | default $caption -}}
{{- $class := .Get "class" | default "" -}}

<figure class="my-8 {{ $class }}">
  <button
    type="button"
    class="zoom-trigger group relative block w-full cursor-zoom-in rounded-xl"
    onclick="openImageModal('{{ $src }}', '{{ $alt }}', '{{ $caption | markdownify | htmlEscape | safeJS }}')"
    aria-label="Enlarge image: {{ $alt }}"
  >
    <img
      src="{{ $src }}"
      alt="{{ $alt }}"
      loading="lazy"
      class="mx-auto max-h-[28rem] w-auto max-w-full rounded-xl shadow-[0_6px_20px_-4px_rgba(0,0,0,0.65)]"
    />
    <span
      class="pointer-events-none absolute right-3 top-3 rounded-lg bg-white/90 p-2 text-gray-600 opacity-0 shadow-md transition-opacity duration-200 group-hover:opacity-100 dark:bg-gray-900/90 dark:text-gray-300"
    >
      <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path>
      </svg>
    </span>
  </button>
  {{- if $caption -}}
  <figcaption class="mt-0 text-sm text-gray-600 dark:text-gray-400 text-center italic">
    {{ $caption | markdownify }}
  </figcaption>
  {{- end -}}
</figure>
