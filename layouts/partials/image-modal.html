<!-- Image Modal -->
<div id="image-modal" class="hidden fixed inset-0 z-50 overflow-y-auto">
  <div class="flex items-center justify-center min-h-screen px-4 py-4">
    <div class="fixed inset-0 bg-black/75 backdrop-blur-sm transition-opacity z-40"></div>
    <div class="relative inline-block align-middle text-left transform transition-all sm:my-8 sm:align-middle sm:max-w-4xl sm:w-full z-50">
      <div class="flex items-center justify-end mb-2">
        <button id="image-modal-close" class="cursor-pointer p-2 text-gray-300 hover:text-white">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      <div class="flex justify-center">
        <img id="image-modal-img" src="" alt="" class="max-w-full max-h-[calc(100vh_-_9rem)] w-auto h-auto object-contain rounded-xl shadow-[0_6px_20px_-4px_rgba(0,0,0,0.65)]">
      </div>
      <div id="image-modal-caption" class="mt-3 text-sm text-gray-300 text-center italic hidden"></div>
    </div>
  </div>
</div>
